<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manual do Framework</title>
<meta name="description" content="Manual do framework de combate para Roblox (Luau): conceitos, API, enums, receitas e fluxo de trabalho.">
<link rel="stylesheet" href="assets/style.css">
<script>
  // Tema antes do primeiro paint (sem piscar). localStorage pode falhar em file:// ou modo privado.
  (function () {
    try {
      var t = localStorage.getItem("fwdocs-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
</head>
<body>
<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir o índice" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
  </button>
  <a class="brand" href="#inicio">
    <span class="brand-mark" aria-hidden="true">FW</span>
    <span class="brand-text">Manual do Framework</span>
  </a>
  <div class="search" role="search">
    <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="searchInput" type="search" autocomplete="off" spellcheck="false"
           placeholder="Buscar (ex.: dano, cooldown, empurrar, carta)…" aria-label="Buscar na documentação"
           aria-controls="searchResults" aria-expanded="false">
    <kbd class="search-kbd" aria-hidden="true">/</kbd>
    <div id="searchResults" class="search-results" role="listbox" hidden></div>
  </div>
  <button class="icon-btn" id="themeBtn" aria-label="Alternar tema claro/escuro">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
  </button>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Índice">
    <div class="sidebar-tools">
      <button class="link-btn" id="expandAll">Expandir tudo</button>
      <button class="link-btn" id="collapseAll">Recolher</button>
    </div>
    <div id="tree" class="tree"></div>
  </nav>
  <div class="scrim" id="scrim" hidden></div>
  <main class="content" id="content" tabindex="-1">
    <noscript><p>Este manual precisa de JavaScript ligado no navegador.</p></noscript>
  </main>
</div>

<script src="assets/app.js"></script>
<script src="content/00-inicio.js"></script>
<script src="content/01-conceitos.js"></script>
<script src="content/01b-guias.js"></script>
<script src="content/02-api-nucleo.js"></script>
<script src="content/03-api-componentes.js"></script>
<script src="content/04-api-skill.js"></script>
<script src="content/05-api-modulos.js"></script>
<script src="content/06-enums.js"></script>
<script src="content/07-receitas.js"></script>
<script src="content/08-fluxo.js"></script>
<script src="content/sinonimos.js"></script>
<script>DOCS.start();</script>
</body>
</html>
